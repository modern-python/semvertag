name: 'semvertag'
description: 'Auto-tag your GitHub repository with a SemVer git tag based on commits or branch prefixes.'
author: 'modern-python'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  strategy:
    description: 'Bump strategy: branch-prefix (default) or conventional-commits.'
    required: false
    default: 'branch-prefix'
  token:
    description: 'GitHub token with contents: write. Defaults to the workflow-issued github.token.'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'If true, compute the bump and emit the planned tag/bump but do not push a tag.'
    required: false
    default: 'false'

outputs:
  tag:
    description: 'The created tag (e.g. 1.2.3, or v1.2.3 in a v-prefixed repo), or empty string if no bump was warranted.'
    value: ${{ steps.run.outputs.tag }}
  bump:
    description: 'The computed bump: none | patch | minor | major.'
    value: ${{ steps.run.outputs.bump }}
  status:
    description: 'The run status: created (tag pushed) | no-bump (nothing to tag).'
    value: ${{ steps.run.outputs.status }}

runs:
  using: 'composite'
  steps:
    - uses: astral-sh/setup-uv@v7

    - name: Run semvertag
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        SEMVERTAG_STRATEGY: ${{ inputs.strategy }}
      run: |
        set -euo pipefail
        dry_run_flag=''
        if [ "${{ inputs.dry-run }}" = "true" ]; then dry_run_flag='--dry-run'; fi
        # `$dry_run_flag` is intentionally unquoted: empty value collapses
        # to no argument; non-empty expands to the literal `--dry-run`.
        result=$(uvx 'semvertag>=0.5.0,<1' tag --json $dry_run_flag)
        printf '%s\n' "$result"
        # Normalize the CLI's internal status to a stable consumer-facing enum:
        # `created`, or `no-bump` for any other status (`no_tags`, `dry_run`, a
        # strategy's decline, ...). `set -euo pipefail` ensures we never reach
        # here on CLI errors, so there is no `error` value to surface.
        case "$(jq -r '.status' <<<"$result")" in
          created) status='created' ;;
          *)       status='no-bump' ;;
        esac
        printf 'tag=%s\n'    "$(jq -r '.tag // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
        printf 'bump=%s\n'   "$(jq -r '.bump'      <<<"$result")" >> "$GITHUB_OUTPUT"
        printf 'status=%s\n' "$status"                            >> "$GITHUB_OUTPUT"
